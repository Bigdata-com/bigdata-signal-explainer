app = "bigdata-signal-explainer"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/app.db"
  COOKIE_SECURE = "true"
  OPENAI_MODEL = "gpt-6-sol"

# SQLite lives on this volume, so keep exactly one machine.
[mounts]
  source = "signal_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Runs execute as background tasks in the server process; a stopped machine would drop them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
