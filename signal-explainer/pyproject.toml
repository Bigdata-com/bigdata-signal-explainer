[project]
name = "bigdata-signal-explainer"
version = "0.1.0"
description = "Explain news-driven sentiment moves as narratives for fundamental PMs, powered by Bigdata.com"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "openai>=3.40.0",
    "markdown>=3.11.2",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
