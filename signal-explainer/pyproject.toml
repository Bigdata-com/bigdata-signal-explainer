[project]
name = "bigdata-signal-explainer"
version = "0.1.0"
description = "Explain news-driven sentiment moves as narratives for fundamental PMs, powered by Bigdata.com"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.60",
    "markdown>=3.6",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
